<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Azzurro Caffè Portal</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/features/auth/auth.css">
</head>
<body>
  <div id="menuOverlay"></div>
  <header>
    <div class="container">
      <nav id="navbar">
        <div class="logo">
          <i class="fa-solid fa-a" style="color: #fff"></i>
          <a href="/index.html">zzurro <i><b>C</b></i>affè</a>
        </div>
      </nav>
    </div>
  </header>
  <main class="portal-shell">
    <div class="portal-card">
      <h1>Azzurro Caffè</h1>
      <p>Choose your portal</p>
      <div class="portal-grid">
        <button class="portal-choice" data-role="customer">
          <strong>Customer</strong>
          <span>Browse menu, order, and track live.</span>
        </button>
        <button class="portal-choice" data-role="admin">
          <strong>Admin</strong>
          <span>Dashboard, inventory, staff, AI.</span>
        </button>
        <button class="portal-choice" data-role="waiter">
          <strong>Waiter</strong>
          <span>Serve ready orders.</span>
        </button>
        <button class="portal-choice" data-role="kitchen">
          <strong>Kitchen</strong>
          <span>Accept and prepare orders.</span>
        </button>
        <button class="portal-choice" data-role="host">
          <strong>Host</strong>
          <span>Seat customers and manage waitlist.</span>
        </button>
        <button class="portal-choice" data-role="inventory">
          <strong>Inventory</strong>
          <span>Stock and restock management.</span>
        </button>
      </div>
      <form id="loginForm" class="portal-form">
        <input type="hidden" id="roleInput" value="customer">
        <input id="email" type="email" placeholder="Email" required>
        <input id="password" type="password" placeholder="Password" required>
        <button type="submit" class="primary-btn">Sign In</button>
        <button id="googleLoginBtn" type="button" class="secondary-btn">Continue with Google</button>
        <div id="loginError" class="error-inline"></div>
        <details class="demo-box">
          <summary>Demo Credentials</summary>
          <ul>
            <li>Admin: admin@azzurro.demo / password123</li>
            <li>Kitchen: kitchen@azzurro.demo / password123</li>
            <li>Waiter: waiter@azzurro.demo / password123</li>
            <li>Host: host@azzurro.demo / password123</li>
            <li>Inventory: inventory@azzurro.demo / password123</li>
          </ul>
        </details>
      </form>
    </div>
  </main>
  <script src="https://kit.fontawesome.com/64c17729fa.js" crossorigin="anonymous"></script>
  <script src="/features/auth/auth.js"></script>
</body>
</html>
